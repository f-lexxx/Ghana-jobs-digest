name: Daily jobs update

on:
  schedule:
    - cron: '0 6 * * *'     # 06:00 GMT = 06:00 in Ghana, every day
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Fetch, classify and build jobs.json
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scripts/fetch-jobs.mjs

      - name: Remember what we have already shown you
        run: |
          git config user.name  "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || (git commit -m "Update seen-jobs state" && git push)

      - name: Email me the morning digest (GitHub issue notification)
        if: github.event_name == 'schedule' && vars.DAILY_DIGEST != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q "^## 0 new jobs" site/digest.md; then echo "No new jobs today"; else
            gh issue create --title "Jobs for $(date -u +%A\ %d\ %B)" --body-file site/digest.md
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
